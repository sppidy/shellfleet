# shellfleet-agent — Helm values
#
# CE chart. The defaults install a read-only agent that can list pods,
# describe resources, and tail logs. Flip `rbac.exec` for `kubectl exec`,
# `rbac.write` once slice 6 / EE adds apply+scale.

# Container image. CI publishes multi-arch images to GHCR on every
# k8s-related commit to main. Build locally via
# `docker build -f Dockerfile.agent.k8s` at the super-repo root and
# point this elsewhere if you'd rather host it yourself.
image:
  repository: ghcr.io/sppidy/shellfleet/agent-k8s
  tag: ""           # default to .Chart.appVersion (see Chart.yaml)
  pullPolicy: IfNotPresent
imagePullSecrets: []

# How the agent reaches the dashboard. Match these to your deploy.
# `serverApiUrl` is for HTTPS (device-auth pairing); `serverWsUrl` is the
# WebSocket the agent uses to receive commands. Both are required.
#
# In a hardened deploy, point `wsUrl` at the server's mutual-TLS
# listener (e.g. wss://dashboard.example.com:8443/agent/ws) and set
# `mtls.existingSecret` below. The agent then presents its client cert
# and pins the server CA, so DNS-hijack / public-CA compromise can't
# impersonate the server.
server:
  apiUrl: "https://dashboard.example.com"
  wsUrl:  "wss://dashboard.example.com/agent/ws"

# Agent↔server mutual TLS. Create a Secret with keys
# `agent.crt`, `agent.key`, and `server-ca.crt` (the agent's client
# cert+key and the CA that signed the server cert), then set
# `existingSecret` to its name. The chart mounts them read-only at
# /etc/shellfleet/mtls and points the agent's mTLS env vars at them.
# Leave `existingSecret` empty to disable mTLS (e.g. dev, or when the
# server still terminates agent WS via nginx).
mtls:
  existingSecret: ""

# Pairing credentials. Two paths, pick one:
#
#   1. Bootstrap via device-auth (recommended on first install). Leave
#      `existingSecret` empty. The agent prints a one-time pairing code on
#      first start; paste it at `/device` in the dashboard. The issued access,
#      refresh, and expiry files are stored on the state volume below.
#
#   2. Existing credentials. Create a Secret with `agent-token.txt` and,
#      preferably, `agent-refresh.txt` plus `agent-token-expiry.txt`. The chart
#      copies recognized files into an empty state volume exactly once. It
#      never overwrites credentials subsequently rotated by the agent. Remove
#      the stale bootstrap Secret after confirming the PVC-backed connection.
token:
  existingSecret: ""           # Secret name; agent-token.txt is required

# Durable agent credentials. Enabled by default because access tokens are
# short-lived and refresh tokens rotate on every use. An emptyDir would force
# a new operator-approved pairing after Pod replacement.
persistence:
  enabled: true
  # Use an already-provisioned PVC instead of creating one. When set, the
  # accessModes, storageClass, size, and retain values below are ignored.
  existingClaim: ""
  # Empty uses the cluster's default StorageClass. Set "-" for no class.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 64Mi
  # Keep chart-created credentials on `helm uninstall`. Delete the retained
  # PVC explicitly when the agent identity should be destroyed.
  retain: true

# RBAC posture. Read-only is the safety floor — every operator gets
# this. Flip the toggles below to add capabilities.
rbac:
  # Always created — read access to pods, deployments, services,
  # ingresses, pvcs, events. Logs are also read.
  read: true

  # `kubectl exec` into pods + their stdin streams. Slice-4 feature.
  # Off by default because exec is effectively a shell on every pod.
  exec: false

  # Apply / scale / delete (slice 6 / EE — currently a no-op since
  # the agent doesn't ship apply handlers yet, but the role survives
  # to make a future enable a single-flag flip).
  write: false

# Standard k8s knobs.
replicaCount: 1
serviceAccount:
  create: true
  annotations: {}
  # Required when create=false. Empty is rejected so cluster privileges are
  # never attached to the namespace's shared default service account.
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

# Optional extra environment for the container — useful for things
# like RUST_LOG. Don't put secrets here; use envFrom + a Secret.
extraEnv: []
extraEnvFrom: []

# Pod-level securityContext. UID/GID 10001 matches the published image. The
# fsGroup owns a freshly provisioned state volume and can read mounted Secret
# material without granting world-readable credential permissions.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext. Defaults strip caps and lock
# the rootfs read-only; the agent only writes to the state volume mounted at
# /var/lib/shellfleet-agent.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop: ["ALL"]

# Optional NetworkPolicy. Off by default because many small k3s
# clusters don't run a NetworkPolicy-aware CNI (the default
# flannel doesn't enforce them); flip on when you have Calico,
# Cilium, or similar in the path.
#
# When enabled the policy denies ingress (the agent only talks
# outbound) and restricts egress to:
#   - DNS in kube-system,
#   - kube-apiserver (specify your cluster's apiServer CIDR),
#   - the dashboard (TCP/443 to the configured CIDRs, or 0.0.0.0/0
#     minus the cluster pod/service CIDRs as a safety floor).
networkPolicy:
  enabled: false
  # CIDR for kube-apiserver if it's reachable at a known IP.
  # Leave empty to skip the apiserver egress rule (kube-rs uses
  # the in-cluster Service in that case, which works without an
  # explicit rule on most CNIs).
  apiServerCidr: ""
  # Pin the dashboard's reachable IP(s) here for tightest
  # egress. Example: ["203.0.113.10/32"] for a single-IP dashboard
  # (replace with your actual dashboard IP — RFC 5737 docs range).
  # Empty = allow TCP/443 to 0.0.0.0/0 minus the cluster CIDRs
  # below.
  dashboardCidrs: []
  # The cluster's pod + service CIDRs. Defaults match k3s
  # (10.42.0.0/16 pods, 10.43.0.0/16 services). Override for
  # other distributions.
  clusterCidrs: []
  # Extra raw rule blocks if you need to allow more egress (e.g.
  # an external Prometheus push gateway) or any ingress.
  extraEgress: []
  extraIngress: []
