apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shellfleet-agent.fullname" . }}
  labels:
    {{- include "shellfleet-agent.labels" . | nindent 4 }}
spec:
  # Singleton — multi-replica gives no benefit, the agent multiplexes
  # requests on a single WS connection back to the dashboard.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shellfleet-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shellfleet-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Stable hostname so the agent's hostname-derived agent_id
      # doesn't change on every Pod recreate (default would be the
      # mutable pod name with the deployment hash). Lets a fixed
      # Prometheus `instance` label, ShellFleet UI bookmarks, and
      # any cross-references in the dashboard survive rollouts.
      hostname: {{ include "shellfleet-agent.fullname" . }}
      subdomain: {{ include "shellfleet-agent.fullname" . }}
      serviceAccountName: {{ include "shellfleet-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # fsGroup makes fresh persistent volumes writable by the image's
      # unprivileged UID/GID. Override per-deploy only when using an image
      # built with a different runtime identity.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.token.existingSecret }}
      initContainers:
        - name: bootstrap-credentials
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -s /state/agent-token.txt ]; then
                test -s /bootstrap/agent-token.txt || {
                  echo "token.existingSecret must contain agent-token.txt" >&2
                  exit 1
                }
                umask 077
                for file in agent-refresh.txt agent-token-expiry.txt; do
                  if [ -f "/bootstrap/${file}" ]; then
                    cp "/bootstrap/${file}" "/state/.${file}.bootstrap"
                    chmod 0600 "/state/.${file}.bootstrap"
                    mv -f "/state/.${file}.bootstrap" "/state/${file}"
                  else
                    rm -f "/state/${file}"
                  fi
                done
                cp /bootstrap/agent-token.txt /state/.agent-token.txt.bootstrap
                chmod 0600 /state/.agent-token.txt.bootstrap
                mv -f /state/.agent-token.txt.bootstrap /state/agent-token.txt
              fi
          args: []
          volumeMounts:
            - name: agent-state
              mountPath: /state
            - name: bootstrap-credentials
              mountPath: /bootstrap
              readOnly: true
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --pair-if-needed
          env:
            - name: SERVER_API_URL
              value: {{ .Values.server.apiUrl | quote }}
            - name: SERVER_WS_URL
              value: {{ .Values.server.wsUrl | quote }}
            {{- if .Values.mtls.existingSecret }}
            # Agent↔server mutual TLS. The agent presents its client
            # cert and pins the server CA, so a DNS-hijack / CA compromise
            # can't impersonate the server to this agent.
            - name: AGENT_MTLS_CERT_PATH
              value: /etc/shellfleet/mtls/agent.crt
            - name: AGENT_MTLS_KEY_PATH
              value: /etc/shellfleet/mtls/agent.key
            - name: SERVER_TLS_CA_PATH
              value: /etc/shellfleet/mtls/server-ca.crt
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Device-auth access, refresh, and expiry credentials live here.
            # The default PVC preserves them across restarts and upgrades.
            - name: agent-state
              mountPath: /var/lib/shellfleet-agent
            {{- if .Values.mtls.existingSecret }}
            # Agent client cert + key + server CA for mutual TLS.
            - name: agent-mtls
              mountPath: /etc/shellfleet/mtls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Container-level securityContext. Together with the
          # Pod-level one above this drops to a non-root,
          # capabilities-stripped, read-only-rootfs posture by
          # default. Override per-deploy via
          # `.Values.containerSecurityContext`.
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: agent-state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "shellfleet-agent.stateClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.token.existingSecret }}
        - name: bootstrap-credentials
          secret:
            secretName: {{ .Values.token.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.mtls.existingSecret }}
        - name: agent-mtls
          secret:
            secretName: {{ .Values.mtls.existingSecret }}
            items:
              - key: agent.crt
                path: agent.crt
                mode: 0440
              - key: agent.key
                path: agent.key
                mode: 0440
              - key: server-ca.crt
                path: server-ca.crt
                mode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
