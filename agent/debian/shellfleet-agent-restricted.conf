[Service]
# Installed as a systemd drop-in by `shellfleet-agent-mode restricted`.
# This is an observation/delegation posture, not the full host-management
# posture advertised by the dashboard.
User=shellfleet
Group=shellfleet
Environment=SHELLFLEET_AGENT_MODE=restricted
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=true
PrivateDevices=true
# Interactive sessions use the separate root broker and still need a PTY.
BindPaths=/dev/pts
ProtectSystem=strict
ProtectHome=yes
ProtectProc=invisible
RestrictSUIDSGID=true
MemoryDenyWriteExecute=true
ReadWritePaths=/var/lib/shellfleet-agent
AppArmorProfile=-shellfleet-agent
