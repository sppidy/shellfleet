name: CLI release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to upload assets to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cli-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build CLI
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release --package shellfleet-cli
          strip: true

      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          tar -C "target/${{ matrix.target }}/release" \
            -czf "shellfleet-${{ matrix.target }}.tar.gz" shellfleet

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "shellfleet-${{ matrix.target }}.tar.gz" --clobber
